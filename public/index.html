<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sieger" />
    <link rel="manifest" href="/manifest.json" />
    <title>Sieger AI</title>
    <style>
      :root {
        --bg: #f3f6ff;
        --bg-2: #eef7ff;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-strong: #ffffff;
        --panel-alt: #edf4ff;
        --ink: #0f172a;
        --muted: #5b6478;
        --primary: #4f46e5;
        --primary-2: #7c3aed;
        --primary-soft: rgba(79, 70, 229, 0.12);
        --line: rgba(148, 163, 184, 0.28);
        --user: linear-gradient(135deg, #4f46e5, #7c3aed);
        --bot: #f2f6ff;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --shadow: 0 24px 60px rgba(79, 70, 229, 0.18);
      }

      body[data-theme="dark"] {
        --bg: #050b17;
        --bg-2: #0f172a;
        --panel: rgba(15, 23, 42, 0.78);
        --panel-strong: #111827;
        --panel-alt: #111f38;
        --ink: #edf2ff;
        --muted: #9aa7bd;
        --primary: #8b5cf6;
        --primary-2: #60a5fa;
        --primary-soft: rgba(139, 92, 246, 0.18);
        --line: rgba(148, 163, 184, 0.22);
        --user: linear-gradient(135deg, #8b5cf6, #60a5fa);
        --bot: rgba(96, 165, 250, 0.1);
        --shadow: 0 24px 60px rgba(2, 6, 23, 0.52);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top left, rgba(124, 58, 237, 0.18), transparent 30%),
          radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.15), transparent 25%),
          linear-gradient(135deg, var(--bg), var(--bg-2));
        color: var(--ink);
        font-family: Inter, Arial, sans-serif;
        transition: background 0.25s ease, color 0.25s ease;
      }

      body {
        padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
      }

      .app {
        max-width: 1600px;
        margin: 0 auto;
        min-height: calc(100vh - 24px);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        padding: 8px 4px;
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        display: grid;
        place-items: center;
        color: white;
        font-weight: 900;
        box-shadow: var(--shadow);
      }

      .brand {
        font-size: clamp(1.5rem, 2vw, 2rem);
        font-weight: 900;
        letter-spacing: -0.06em;
      }

      .brand small {
        display: block;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .toolbar-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 12px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        border-color: rgba(79, 70, 229, 0.4);
      }

      .btn.primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        border-color: transparent;
      }

      .layout {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 20px;
        min-height: calc(100vh - 120px);
      }

      @media (max-width: 860px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          order: 2;
        }

        .chat-panel {
          order: 1;
        }

        .chat-body {
          height: 52vh;
          min-height: 340px;
        }
      }

      .sidebar,
      .chat-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .sidebar {
        padding: 18px;
      }

      .sidebar h3 {
        margin: 0 0 14px;
        font-size: 0.9rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .quick-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
      }

      .quick-btn {
        width: 100%;
        text-align: left;
        background: var(--panel-alt);
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: 12px;
        padding: 12px 14px;
        cursor: pointer;
        font-weight: 600;
      }

      .prompt-box {
        margin-top: 12px;
      }

      .prompt-box textarea {
        width: 100%;
        min-height: 150px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        background: rgba(255,255,255,0.2);
        color: var(--ink);
        font: inherit;
      }

      .prompt-box .btn {
        width: 100%;
        margin-top: 10px;
      }

      .chat-panel {
        overflow: hidden;
      }

      .chat-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(255,255,255,0.15);
      }

      .chat-title {
        font-size: 1.05rem;
        font-weight: 800;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(16, 185, 129, 0.12);
        color: var(--success);
        font-weight: 700;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        background: var(--success);
        border-radius: 50%;
        display: inline-block;
      }

      .chat-body {
        height: calc(100vh - 260px);
        min-height: 520px;
        overflow-y: auto;
        padding: 22px 18px;
        background: linear-gradient(180deg, rgba(79,70,229,0.02), rgba(59,130,246,0.02));
      }

      .msg {
        max-width: 78%;
        padding: 14px 16px;
        border-radius: 18px;
        line-height: 1.65;
        margin-bottom: 14px;
        white-space: pre-wrap;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
      }

      .msg.user {
        margin-left: auto;
        background: var(--user);
        color: white;
        border-top-right-radius: 6px;
      }

      .msg.bot {
        background: var(--bot);
        color: var(--ink);
        border-top-left-radius: 6px;
      }

      .msg.error {
        background: rgba(239, 68, 68, 0.10);
        border: 1px solid rgba(239, 68, 68, 0.20);
        color: #b91c1c;
      }

      .chat-form {
        display: flex;
        gap: 10px;
        padding: 16px 18px 18px;
        border-top: 1px solid var(--line);
        background: rgba(255,255,255,0.05);
      }

      .chat-form input {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 1rem;
        background: rgba(255,255,255,0.25);
        color: var(--ink);
      }

      .chat-form .btn {
        min-width: 140px;
      }

      @media (max-width: 840px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .chat-body {
          height: 440px;
        }
      }
    </style>
  </head>
  <body data-theme="light">
    <div class="app">
      <header class="toolbar">
        <div class="brand-wrap">
          <div class="brand-mark">S</div>
          <div class="brand">Sieger<small>AI assistant</small></div>
        </div>
        <div class="toolbar-actions">
          <button class="btn" id="themeToggle" type="button">Тема: светлая</button>
          <button class="btn primary" id="newChatBtn" type="button">Новый чат</button>
        </div>
      </header>

      <div class="layout">
        <aside class="sidebar">
          <h3>Быстрые действия</h3>
          <div class="quick-actions">
            <button class="quick-btn" type="button" data-prompt="Сделай продуманный план по развитию проекта AI">План проекта</button>
            <button class="quick-btn" type="button" data-prompt="Объясни LLM простыми словами и покажи сильные стороны">Что такое LLM</button>
            <button class="quick-btn" type="button" data-prompt="Найди возможные ошибки в этом тексте и предложи исправления">Проверить ошибки</button>
            <button class="quick-btn" type="button" data-prompt="Напиши современный код на JavaScript для чата с AI">Код чата</button>
          </div>

          <div class="prompt-box">
            <h3>Промпт системы</h3>
            <textarea id="systemPrompt" spellcheck="false">Ты — Sieger, современный AI-ассистент. Отвечай ясно, по делу и замечай ошибки в логике, формулировках и тексте. Если видишь проблему, предложи исправление.</textarea>
            <button class="btn primary" id="savePromptBtn" type="button">Сохранить промпт</button>
          </div>
        </aside>

        <main class="chat-panel">
          <div class="chat-head">
            <div class="chat-title">Чат Sieger</div>
            <div class="status-pill"><span class="status-dot"></span>online</div>
          </div>
          <div class="chat-body" id="chatBody"></div>
          <form class="chat-form" id="chatForm">
            <input id="chatInput" type="text" placeholder="Напишите сообщение..." autocomplete="off" />
            <button class="btn primary" type="submit">Отправить</button>
          </form>
        </main>
      </div>
    </div>

    <script>
      const STORAGE_KEY = 'simple_ai_chat_state_v1';
      const DEFAULT_PROMPT = 'Ты — Sieger, современный AI-ассистент. Отвечай ясно, по делу и замечай ошибки в логике, формулировках и тексте. Если видишь проблему, предложи исправление.';

      const state = loadState();
      const chatBody = document.getElementById('chatBody');
      const chatForm = document.getElementById('chatForm');
      const chatInput = document.getElementById('chatInput');
      const systemPromptEl = document.getElementById('systemPrompt');
      const themeToggle = document.getElementById('themeToggle');
      const newChatBtn = document.getElementById('newChatBtn');
      const savePromptBtn = document.getElementById('savePromptBtn');

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          return {
            theme: saved.theme || 'light',
            prompt: saved.prompt || DEFAULT_PROMPT,
            messages: Array.isArray(saved.messages) && saved.messages.length ? saved.messages : [
              { role: 'bot', content: 'Привет! Я Sieger. Я помогу с идеями, текстом, логикой и исправлением ошибок.' }
            ]
          };
        } catch {
          return {
            theme: 'light',
            prompt: DEFAULT_PROMPT,
            messages: [{ role: 'bot', content: 'Привет! Я Sieger. Я помогу с идеями, текстом, логикой и исправлением ошибок.' }]
          };
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          theme: state.theme,
          prompt: state.prompt,
          messages: state.messages
        }));
      }

      function applyTheme() {
        document.body.dataset.theme = state.theme;
        themeToggle.textContent = state.theme === 'dark' ? 'Тема: тёмная' : 'Тема: светлая';
      }

      function renderMessages() {
        chatBody.innerHTML = '';
        for (const message of state.messages) {
          const div = document.createElement('div');
          div.className = `msg ${message.role}`;
          if (message.role === 'bot' && /ошибк|error|не работает|неправильн/i.test(message.content)) {
            div.classList.add('error');
          }
          div.textContent = message.content;
          chatBody.appendChild(div);
        }
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      function pushMessage(role, content) {
        state.messages.push({ role, content });
        if (state.messages.length > 30) {
          state.messages = state.messages.slice(-30);
        }
        saveState();
        renderMessages();
      }

      function addQuickPrompt(promptText) {
        chatInput.value = promptText;
        chatInput.focus();
      }

      themeToggle.addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        applyTheme();
        saveState();
      });

      newChatBtn.addEventListener('click', () => {
        state.messages = [{ role: 'bot', content: 'Новый чат создан. Я Sieger. Что нужно проверить, улучшить или исправить?' }];
        saveState();
        renderMessages();
      });

      savePromptBtn.addEventListener('click', () => {
        state.prompt = systemPromptEl.value.trim() || DEFAULT_PROMPT;
        saveState();
        alert('Промпт сохранён');
      });

      document.querySelectorAll('.quick-btn').forEach((button) => {
        button.addEventListener('click', () => addQuickPrompt(button.dataset.prompt));
      });

      chatForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = chatInput.value.trim();
        if (!message) return;

        pushMessage('user', message);
        chatInput.value = '';

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message,
              history: state.messages.slice(0, -1),
              systemPrompt: state.prompt
            })
          });

          const data = await response.json();
          if (!data.ok) {
            throw new Error(data.error || 'Не удалось получить ответ.');
          }

          pushMessage('bot', data.reply || 'Не удалось получить ответ.');
        } catch (error) {
          pushMessage('bot', error.message || 'Сервис временно недоступен. Проверьте ключ API и сервер.');
        }
      });

      systemPromptEl.value = state.prompt;
      applyTheme();
      renderMessages();

      if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
        document.body.classList.add('standalone');
      }
    </script>
  </body>
</html>
